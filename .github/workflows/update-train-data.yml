name: Update train data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Realtime Trains data
        env:
          RTT_TOKEN: ${{ secrets.RTT_TOKEN }}
          RTT_USERNAME: ${{ secrets.RTT_USERNAME }}
          RTT_PASSWORD: ${{ secrets.RTT_PASSWORD }}
          RTT_AUTH_MODE: ${{ vars.RTT_AUTH_MODE }}
          RTT_BASE: ${{ vars.RTT_BASE }}
        run: node fetch-data.js

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/line.json data/departures.json
          git diff --staged --quiet || git commit -m "Update train data"
          git push --force-with-lease
