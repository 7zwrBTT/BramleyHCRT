name: Update train data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm' # Optional: Speeds up your workflow runs

      # FIX: Ensure dependencies are installed before running the script
      - name: Install dependencies
        run: npm install

      # Your script will now see RTT_TOKEN and automatically use Bearer authentication
      - name: Fetch Realtime Trains data
        env:
          RTT_TOKEN: ${{ secrets.RTT_TOKEN }}
          RTT_AUTH_MODE: "bearer" # Forces your script into token mode
          RTT_BASE: ${{ vars.RTT_BASE }}
        run: node fetch-data.js

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/line.json data/departures.json
          git diff --staged --quiet || git commit -m "Update train data"
          git push --force-with-lease
