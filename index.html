<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bramley Live CRT</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  background:#020402;
  color:#00ff99;
  font-family:Courier New,monospace;
  padding:18px;
  margin:0;
  text-shadow:0 0 8px rgba(0,255,120,.7);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,255,100,.05),
    rgba(0,255,100,.05) 2px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

.screen{
  border:3px solid #00ff99;
  border-radius:20px;
  padding:18px;
  box-shadow:0 0 20px rgba(0,255,153,.4);
}

h1{
  text-align:center;
  margin:0;
  font-size:2.2rem;
}

.sub{
  text-align:center;
  opacity:.6;
  margin-bottom:20px;
}

.panel{
  border:2px solid #00ff99;
  border-radius:12px;
  padding:12px;
  margin-bottom:18px;
  background:rgba(0,255,100,.03);
}

.title{
  opacity:.7;
  margin-bottom:12px;
}

.row{
  display:grid;
  grid-template-columns:80px 1fr 60px;
  gap:10px;
  padding:10px 0;
  border-bottom:1px dashed rgba(0,255,120,.25);
}

.late{
  color:#ffbb00;
}

.error{
  color:#ff6666;
}

#clock{
  float:right;
}

#barrier{
  font-weight:bold;
  font-size:1.4rem;
}

.open{
  color:#00ff99;
}

.closed{
  color:#ff4444;
}

.footer{
  text-align:center;
  opacity:.45;
  margin-top:20px;
  font-size:.8rem;
}
</style>
</head>
<body>

<div class="screen">

<h1>BRAMLEY</h1>
<div class="sub">HAMPSHIRE LIVE CRT TERMINAL</div>

<div class="panel">
<div class="title">BARRIER STATUS</div>

<div>
<span id="barrier" class="open">OPEN</span>
<span id="clock"></span>
</div>

</div>

<div class="panel">
<div class="title">LIVE NATIONAL RAIL DEPARTURES</div>

<div id="board">
Loading live data...
</div>
</div>

<div class="footer">
LIVE ENGINE MODE • AUTO REFRESH 60 SEC
</div>

</div>

<script>

const board = document.getElementById("board");

function updateClock(){
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString("en-GB");
}

setInterval(updateClock,1000);
updateClock();

async function loadLiveData(){

  try{
    // Fetch via an open public mirror to bypass cross-origin browser security locks (CORS)
    const targetUrl = "https://transportapi.com/v3/uk/train/station/BMY/live.json?app_id=0c1d1a6e&app_key=2ef819bc5a4ef694fe6b41299df9469e&train_status=passenger";
    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error("Network issue");
    
    const wrapper = await response.json();
    // Allorigins wraps the string data inside a .contents field
    const data = JSON.parse(wrapper.contents);
    
    const departures = data.departures?.all || [];

    if(departures.length === 0){
      board.innerHTML = `<div class="sub" style="text-align:center; padding:15px;">No upcoming departures scheduled.</div>`;
      autoBarrier([]);
      return;
    }

    const rows = departures.map(train => {
      let statusText = "On time";
      if (train.status === "LATE" || train.status === "DELAYED") {
        statusText = `Late (${train.expected_departure_time || 'Delayed'})`;
      } else if (train.status === "CANCELLED") {
        statusText = "Cancelled";
      }

      return {
        time: train.aimed_departure_time || "--:--",
        destination: train.destination_name || "Unknown Destination",
        platform: train.platform || "-",
        status: statusText
      };
    });

    board.innerHTML = rows.slice(0,8).map(train => `
      <div class="row">
        <div class="${train.status.includes('Late') || train.status.includes('Cancelled') ? 'late':''}">
          ${train.time}
        </div>

        <div>
          ${train.destination}
          ${train.status !== 'On time'
            ? `<span class="late"> • ${train.status}</span>`
            : ''
          }
        </div>

        <div>P${train.platform}</div>
      </div>
    `).join("");

    autoBarrier(rows);

  }catch(err){
    console.error("Fetch error:", err);
    board.innerHTML = `
      <div class="error">
        LIVE FEED TEMPORARILY UNAVAILABLE<br><br>
        Check connection or service status.
      </div>
    `;
  }
}

function autoBarrier(rows){
  const now = new Date();
  let closingSoon = false;

  rows.forEach(r => {
    if(!r.time) return;

    const parts = r.time.split(":");
    const t = new Date();
    t.setHours(parts[0]);
    t.setMinutes(parts[1]);
    t.setSeconds(0);

    const diff = (t-now)/1000/60;

    // Trigger barrier down if a train leaves within 2 minutes
    if(diff >= 0 && diff <= 2){
      closingSoon = true;
    }
  });

  const el = document.getElementById("barrier");
  el.innerText = closingSoon ? "CLOSED" : "OPEN";
  el.className = closingSoon ? "closed" : "open";
}

loadLiveData();
setInterval(loadLiveData,60000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>

</body>
</html>
